spring.application.name=magicpass
server.port=8080

# Banco H2 em arquivo (nao precisa instalar nada). Os dados ficam na pasta ./data
spring.datasource.url=jdbc:h2:file:./data/magicpass;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Console do banco: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/magicpass)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
